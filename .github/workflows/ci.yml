name: ci

# Pull requests only: every change reaches main through one, and a run per push to main checked the
# same code again and ran for every digest commit. Actions minutes on a private repository are
# capped, and the cap stopped every workflow on 2026-10-22 (D148).
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What the change touches, in seconds, so `check` and the browser shards start together (2026-11-13:
  # the shards waited for `check`, and a pull request that changes the site took 19 minutes).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      web: ${{ steps.diff.outputs.web }}
      shared: ${{ steps.diff.outputs.shared }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Digest, state and docs commits skip the heavy checks.
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"
            echo "shared=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # An unreachable base (a force-push) must run every check, never skip them.
          if ! changed=$(git diff --name-only "$BASE" HEAD); then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"
            echo "shared=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The tokens (a design system bump moves a pin in a package.json) and the shared stylesheets
          # carry most of the load-bearing design fixes.
          if printf '%s\n' "$changed" | grep -qE '^apps/web/src/styles/player\.css$' ||
            git diff "$BASE" HEAD -- '*package.json' | grep -qE '^[-+].*@singularityfm/design-system'; then
            echo "shared=true" >> "$GITHUB_OUTPUT"
          else
            echo "shared=false" >> "$GITHUB_OUTPUT"
          fi
          # The browser suites are the only checks that see CSS and layout: any change the site is
          # built from may need them: the site, packages, build scripts, the lockfile (which holds the
          # design system pin) and workflows.
          if printf '%s\n' "$changed" | grep -qE '^(apps/web/|packages/|scripts/build|package\.json$|pnpm-(lock|workspace)\.yaml$|tsconfig|\.nvmrc$|\.github/workflows/(ci|browser)\.yml$)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi
          # config/*.json is validated by the test suite, so only the hand-written notes skip it.
          if printf '%s\n' "$changed" | grep -qvE '^(Digests/|state/|docs/|config/sources\.md$|$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Runners are free on this public repository, so the cost of more jobs is the 20 that run at once (the
  # D148 reason for one job was the private repository's minutes, which are gone).
  check:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks lists the pull request's commits, which needs pull-requests: read.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # What ships, read from the lockfile (no install). A high or critical advisory fails the
      # check; path-to-regexp under @astrojs/vercel is held at a patched 6.x by the pnpm-workspace.yaml
      # `overrides` (docs/engineering/hardening.md). The registry's audit service being down (a 503 on
      # 2026-10-22, seven minutes then a failure) is not a finding: it warns and the check passes.
      - name: Audit production dependencies
        shell: bash
        run: |
          set +e
          out=$(timeout 150 pnpm audit --prod --audit-level high --json 2>/dev/null)
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then exit 0; fi
          if ! jq -e '.metadata.vulnerabilities' >/dev/null 2>&1 <<<"$out"; then
            # Only the service being away (a hang, a 5xx, a network error) passes; a broken lockfile
            # or any other error fails, so the audit is never skipped in silence.
            if [ "$code" -eq 124 ] || grep -qiE '"code": *"(E5[0-9][0-9]|ETIMEDOUT|ECONNRESET|ECONNREFUSED|ENOTFOUND|EAI_AGAIN)"|Service Unavailable|Bad Gateway|Gateway Time' <<<"$out"; then
              echo "::warning::the audit service did not answer; dependencies were not audited this run"
              exit 0
            fi
            echo "pnpm audit failed: $out"
            exit 1
          fi
          # The advisories themselves, not every package the severity flows up to.
          jq -r '[.advisories[] | select(.severity == "high" or .severity == "critical") | "\(.severity): \(.module_name): \(.title) \(.url)"] | unique[]' <<<"$out"
          exit 1
      # The record's budgets, links and Index. Always on, because a docs-only change sets code=false and
      # skips everything below, yet two green docs PRs can together break main (D175). Plain node, no install.
      - name: Docs check
        run: node scripts/docsCheck.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The registry can fail for a moment; the install runs again, no other step does.
      - if: needs.changes.outputs.code == 'true'
        run: bash scripts/retry.sh 3 pnpm install --frozen-lockfile --ignore-scripts
      # The Opus transcode (packages/engine/src/audio/transcode.ts) needs ffmpeg with libopus, which
      # the runner image does not carry; without it audio-episodeOpus.test.ts skips.
      - name: ffmpeg
        timeout-minutes: 5
        if: needs.changes.outputs.code == 'true'
        uses: ./.github/actions/ffmpeg
        with:
          required: "true"
      - name: Typecheck
        if: needs.changes.outputs.code == 'true'
        run: pnpm run typecheck
      - name: Lint
        if: needs.changes.outputs.code == 'true'
        run: pnpm run lint
      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: pnpm test
      # The admin repository installs @singularityfm/contracts from npm as compiled JavaScript; the
      # workspace link serves .ts source, so only a packed and installed copy shows a broken export (#485).
      - name: Contracts package
        if: needs.changes.outputs.code == 'true'
        run: node scripts/contractsPack.mjs
      - name: Build site
        if: needs.changes.outputs.code == 'true'
        env:
          SINGULARITY_FIXTURES: "1"
        run: pnpm run build
      # An existing test changes only with the owner's OK (code.md): removed lines in a test, or a
      # changed screenshot, need the tests-ok label. The label is read live, so after adding it re-run
      # this job (ci.yml does not run on `labeled`). Plain node, no install. Last, and run after a failure,
      # so a missing label never hides another check's result.
      - name: Test-edit gate
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/testEditGate.mjs

  # A design fix (a sizer, a fixed width, a specificity bump) is invisible to the checks above: a
  # change that undoes one passes typecheck, lint, unit tests and the build. Both browser suites
  # (browser.yml, which also runs on every push to main and nightly) run for any change the site
  # is built from. They used to run only for the tokens, a shared stylesheet, Dependabot or a
  # `browser` label, so the service worker and BaseLayout change in #346 skipped them and a
  # regression reached main (2026-10-26, D148).
  # They start with `check`, not after it: a change that fails `check` is blocked anyway, but the
  # pull request used to wait for `check` and then for the suites, 19 minutes in all. Five shards now
  # end in about the time of one, and a red `check` costs only free runner minutes.
  browser:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    # A called workflow gets at most the caller's permissions; its `report` job reads the run's artifacts.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/browser.yml

  # The one browser check a ruleset can require (D385). A skipped `browser` caller job reports the
  # bare name `browser`, and a run one reports a name per shard (`browser / site 1/3` and so on, which change with the matrix),
  # so requiring `browser` would hang a site PR and block a docs PR. This job always runs and
  # reports the same name: green when the suites passed or were skipped, red otherwise.
  browser-gate:
    name: browser gate
    needs: [changes, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Suites passed or were skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.browser.result }}
        run: |
          # A failed `changes` skips `browser`, which would read as a pass below.
          if [ "$CHANGES" != "success" ]; then
            echo "::error::change detection: $CHANGES"; exit 1
          fi
          case "$RESULT" in
            success|skipped) echo "browser suites: $RESULT" ;;
            *) echo "::error::browser suites: $RESULT"; exit 1 ;;
          esac
