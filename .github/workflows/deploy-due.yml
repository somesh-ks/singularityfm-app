name: deploy-due

# The reader's batch rule (D375, scripts/deploy-batch.sh) judges a merge's age only when a push to
# main runs it, and since D300 and D385 only a merge pushes to main: a lone merge waited for the next
# one, past three hours (#735, 2026-11-06). Every hour this asks the batch rule the question a push
# would (D389): it reads the live commit from /build.json, runs the reader's own ignoreCommand from
# apps/web/vercel.json as Vercel would for main's head, and only when that says build does it start
# the reader's Deploy Hook. Any doubt does nothing here, the opposite of the script (DOUBT_EXIT tells
# them apart): an hourly schedule that built on doubt would build every hour. A head under 15 minutes
# old is left to its own push build. A hook build that fails leaves the live commit where it was; a
# cache entry per commit and six-hour window fires the hook at most four times a day for one commit,
# so a passing flake is retried and a broken build is not rebuilt every hour.
# shortcut: reader only; admin waits for a push, add its hook if admin lag matters.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# One check at a time: a second one while a hook build starts would see the old commit and fire again.
concurrency:
  group: deploy-due
  cancel-in-progress: false

jobs:
  deploy-due:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://news.someshks.work
      HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_WEB }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # The batch counts commits since the live one; further back than this, nothing is done.
          fetch-depth: 50
      - name: Ask the batch rule whether the reader is due
        id: due
        shell: bash
        run: |
          set -uo pipefail
          # BUILD_ID is the first 12 characters of the deployed commit (apps/web/src/lib/buildId.ts).
          build=$(curl -fsS --max-time 20 "$SITE/build.json" | jq -er '.build | strings | select(test("^[0-9a-f]{7,40}$"))') || {
            echo "No commit in /build.json: nothing to judge."
            exit 0
          }
          live=$(git rev-parse -q --verify "$build^{commit}") && git merge-base --is-ancestor "$live" HEAD || {
            echo "The live build $build is not a commit in main's last 50: nothing to judge."
            exit 0
          }
          head=$(git rev-parse HEAD)
          if [ "$live" = "$head" ]; then
            echo "main's head $build is live."
            exit 0
          fi
          if [ $(($(date +%s) - $(git log -1 --format=%ct HEAD))) -lt 900 ]; then
            echo "main's head ${head:0:12} landed under 15 minutes ago: its push build may be running."
            exit 0
          fi
          ignore=$(jq -er .ignoreCommand apps/web/vercel.json) || exit 1
          (cd apps/web && DOUBT_EXIT=2 VERCEL_GIT_PREVIOUS_SHA="$live" VERCEL_GIT_COMMIT_SHA="$head" VERCEL_GIT_COMMIT_REF=main sh -c "$ignore")
          due=$?
          if [ "$due" -eq 0 ]; then
            echo "Live $build; main is at ${head:0:12} and the batch is not due."
            exit 0
          fi
          if [ "$due" -eq 2 ]; then
            echo "Live $build; the batch rule cannot tell for ${head:0:12}: nothing to do."
            exit 0
          fi
          [ "$due" -eq 1 ] || { echo "The ignoreCommand exited $due."; exit "$due"; }
          if [ -z "$HOOK" ]; then
            echo "The batch is due, but VERCEL_DEPLOY_HOOK_WEB is not set (D389)."
            exit 0
          fi
          echo "Live $build; main's head ${head:0:12} is due."
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "window=$(($(date +%s) / 21600))" >> "$GITHUB_OUTPUT"
      - name: Fired for this commit in this six-hour window?
        id: fired
        if: steps.due.outputs.head
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deploy-due
          key: deploy-due-${{ steps.due.outputs.head }}-${{ steps.due.outputs.window }}
          lookup-only: true
      - name: Start the reader's Deploy Hook
        if: steps.due.outputs.head && steps.fired.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsS -X POST -o /dev/null --max-time 30 "$HOOK"
          echo "Started a build of ${{ steps.due.outputs.head }}."
          echo "${{ steps.due.outputs.head }}" > .deploy-due
      - name: Remember the commit
        if: steps.due.outputs.head && steps.fired.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deploy-due
          key: deploy-due-${{ steps.due.outputs.head }}-${{ steps.due.outputs.window }}
