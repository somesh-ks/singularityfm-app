name: design-system

# The design system lives in its own repository (D382 step 8). Here the owner still decides what bends
# it: a pull request that adds to a list excusing app code from a system check, or changes who owns
# the system, needs the design-system label and his merge. It reads the diff and the labels only, so it installs
# nothing and bills about a minute (D148). Re-run when a label is added or removed.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    # SYSTEM_PATHS and the ALLOWLISTS files in scripts/designSystemGate.mjs; its test fails when a
    # guarded path is missing here.
    paths:
      - .github/CODEOWNERS
      - scripts/designSystemGate.mjs
      - .claude/skills/feature/references/controls-guide.md
      - scripts/systemUse.test.ts
      - apps/web/src/styles/styles.test.ts

concurrency:
  group: design-system-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Label and scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: node scripts/designSystemGate.mjs
