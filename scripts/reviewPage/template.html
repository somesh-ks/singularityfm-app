<title>@TITLE@</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  The review page (docs/engineering/review-page.md). Built by scripts/reviewPage/build.mjs from a
  review.json; do not edit a built index.html by hand. The app's own tokens, font and Button, Badge
  and Banner rules are inlined at build time, so the page reads as the app.
-->
<style>
/*@FONT_FACE@*/
/*@TOKENS@*/
/*@DS@*/

/* The page: one reading column, the stills grid wider. Everything below reads the app's semantic
   tokens only, so light, dark and the viewer's theme toggle all follow tokens.css. */
html { background: var(--color-surface); }
body {
  background: var(--color-surface);
  color: var(--color-on-surface);
  font-family: var(--font-ui);
  font-size: var(--text-body-size);
  line-height: var(--text-body-leading);
  --gutter: max(var(--space-4), env(safe-area-inset-left, 0rem));
  padding-inline: var(--gutter);
  padding-block: 0 var(--space-16);
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
#notes-copy[hidden], section.change[hidden], details.history[hidden] { display: none; }
button { font: inherit; border: 0; background: none; color: inherit; cursor: pointer; }
:focus-visible { outline: 0.125rem solid var(--color-accent); outline-offset: 0.125rem; }
main { max-width: 70rem; margin: 0 auto; display: grid; gap: var(--space-8); }
.measure { max-width: 42.5rem; }

/* Top bar: the PR link, and Copy notes once the page holds a note. */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0rem); z-index: 10; background: var(--color-surface); }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0rem); z-index: 5;
  display: flex; align-items: center; gap: var(--space-2);
  min-height: var(--size-touch); margin-inline: calc(-1 * var(--gutter)); padding-inline: max(var(--gutter), (100% - 70rem) / 2);
  background: var(--color-surface);
}
.topbar .pr { font-weight: var(--font-weight-medium); font-size: var(--text-label-size); color: var(--color-on-surface-muted); text-decoration: none; display: inline-flex; gap: var(--space-1); align-items: center; }
.topbar .pr:hover { color: var(--color-accent); }
.topbar .spacer { flex: 1; }
.topbar .button-text { white-space: nowrap; }

/* Header: title, one quiet line, then what to check. */
header.intro { display: grid; gap: var(--space-2); padding-top: var(--space-4); }
h1 { margin: 0; font-size: var(--text-display-size); line-height: var(--text-display-leading); font-weight: var(--font-weight-medium); text-wrap: balance; }
.meta { margin: 0; color: var(--color-on-surface-muted); font-size: var(--text-meta-size); }
.badge-label.is-new { background: var(--color-accent); color: var(--color-on-accent); }

/* Check lines: each line is the link to the still it names. */
.checks { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--space-1); }
.checks a {
  display: flex; gap: var(--space-2); align-items: baseline; min-height: var(--size-touch); padding-block: var(--space-2);
  color: var(--color-on-surface); text-decoration: none;
}
.checks a::before { content: ""; flex: none; width: 0.5rem; height: 0.5rem; border-radius: var(--shape-round); background: var(--color-accent); transform: translateY(-0.125rem); }
.checks a:hover { color: var(--color-accent); }

/* Filters: the app's pill shape; the picked one takes the accent container. */
.filters { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); align-items: center; }
.filter { display: inline-flex; gap: var(--space-1); padding: 0.125rem; border-radius: var(--shape-round); background: var(--color-surface-container); }
.filter button { min-height: 2.25rem; padding-inline: var(--space-4); border-radius: var(--shape-round); font-size: var(--text-label-size); font-weight: var(--font-weight-medium); color: var(--color-on-surface-muted); }
.filter button[aria-pressed="true"] { background: var(--color-accent-container); color: var(--color-on-accent-container); }

/* A change: its title, then its stills. Light and dark copies of one view share a card; the theme
   filter picks which one shows, so the page is one card per view. */
section.change { display: grid; gap: var(--space-4); scroll-margin-top: var(--space-16); }
.change-head { display: grid; gap: var(--space-1); }
.change-head h2 { margin: 0; font-size: var(--text-title-size); line-height: var(--text-title-leading); font-weight: var(--font-weight-medium); text-wrap: balance; }
.change-head p { margin: 0; color: var(--color-on-surface-reading); }
.grid { display: grid; gap: var(--space-8) var(--space-4); grid-template-columns: repeat(auto-fill, minmax(min(100%, 17.5rem), 1fr)); align-items: start; }

/* A still: the picture (tap to open it full length), then one line of labels. Nothing sits on the
   picture, so nothing hides what is being judged. A tall still shows its top and fades; the viewer
   shows all of it. */
figure.still { margin: 0; display: grid; gap: var(--space-2); min-width: 0; scroll-margin-top: var(--space-16); }
figure.still.is-wide { grid-column: 1 / -1; }
figure.still[hidden] { display: none; }
.media {
  position: relative; display: block; width: 100%; padding: 0; border-radius: var(--shape-md); overflow: hidden; cursor: zoom-in;
  max-height: 75svh; background: var(--color-surface-sunken); box-shadow: 0 0 0 0.0625rem var(--color-surface-container);
}
.media.is-cut::after { content: ""; position: absolute; inset: auto 0 0; height: var(--space-16); background: linear-gradient(transparent, var(--color-surface-sunken)); pointer-events: none; }
/* Never wider than the picture's own pixels: a small crop stays sharp, centred on the card. */
.media img, .media video { display: block; width: auto; height: auto; max-width: 100%; margin-inline: auto; }
.media video { width: 100%; }
.is-flash .media { box-shadow: 0 0 0 0.1875rem var(--color-accent); }
html[data-comment-mode] .media { cursor: crosshair; }
html[data-comment-mode] .media.is-cut::after { display: none; }
figcaption { display: grid; gap: 0; }
.tags { display: flex; gap: var(--space-2); align-items: center; min-width: 0; }
.tags .no { color: var(--color-on-surface); font-weight: var(--font-weight-medium); font-variant-numeric: tabular-nums; }
.tagline { flex: 1; min-width: 0; color: var(--color-on-surface-muted); font-size: var(--text-meta-size); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.comment-btn { margin-inline-end: calc((var(--size-touch) - var(--size-icon-lg)) / -2); }
.cap { margin: 0; font-size: var(--text-meta-size); line-height: var(--text-caption-leading); color: var(--color-on-surface-reading); }

/* Page notes, used only where claude.ai comments are off: numbered pins on the picture. */
.pin {
  position: absolute; transform: translate(-50%, -50%);
  display: grid; place-items: center; width: 1.75rem; height: 1.75rem; border-radius: var(--shape-round);
  background: var(--color-accent); color: var(--color-on-accent); font-size: var(--text-caption-size); font-weight: var(--font-weight-semibold);
  box-shadow: 0 0 0 0.125rem var(--color-surface-raised); pointer-events: none;
}
.notes { display: grid; gap: var(--space-2); }
.notes:empty { display: none; }
.note { display: grid; grid-template-columns: 1.75rem 1fr auto; gap: var(--space-2); align-items: start; }
.note .pin { position: static; transform: none; }
.note textarea { width: 100%; min-height: var(--size-touch); resize: vertical; padding: var(--space-2) var(--space-4); border-radius: var(--shape-sm); border: 0.0625rem solid var(--color-surface-container); background: var(--color-surface-raised); color: var(--color-on-surface); font: inherit; font-size: var(--text-meta-size); }

/* Earlier versions: one line each, closed. */
details.history { padding-top: var(--space-4); color: var(--color-on-surface-muted); }
details.history summary { cursor: pointer; font-size: var(--text-meta-size); min-height: var(--size-touch); display: flex; align-items: center; }
details.history ul { margin: var(--space-2) 0 0; padding-inline-start: 1.25em; display: grid; gap: var(--space-2); color: var(--color-on-surface-reading); }

/* The viewer: full screen, pinch or wheel to zoom, drag to move. */
.viewer { position: fixed; inset: 0; z-index: 20; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); background: var(--color-surface); }
.viewer[hidden] { display: none; }
.viewer-bar {
  display: flex; align-items: center; gap: var(--space-2); min-height: var(--size-touch);
  padding: env(safe-area-inset-top, 0rem) max(var(--space-2), env(safe-area-inset-right, 0rem)) 0 max(var(--space-2), env(safe-area-inset-left, 0rem));
}
.viewer-bar .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--text-label-size); font-weight: var(--font-weight-medium); }
.stage { position: relative; overflow: hidden; touch-action: none; background: var(--color-surface-sunken); padding-bottom: env(safe-area-inset-bottom, 0rem); }
.stage img, .stage video { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; user-select: none; -webkit-user-drag: none; }
@media (prefers-reduced-motion: no-preference) { figure.still .media { transition: box-shadow 200ms; } }
</style>

<div class="topbar">
  <a class="pr" id="pr-link" href="@PR_URL@" target="_blank" rel="noopener" aria-label="Pull request @PR@ on GitHub">#@PR@ @ICON_openInNew@</a>
  <span class="spacer"></span>
  <button class="button-text" id="notes-copy" type="button" hidden>Copy notes</button>
</div>

<main>
  <header class="intro measure">
    <h1 id="title">@HEADING@</h1>
    <p class="meta" id="meta"></p>
  </header>

  <ul class="measure checks" id="check-panel"></ul>
  <div class="filters" id="filters"></div>
  <div id="changes" style="display:grid;gap:var(--space-12)"></div>
  <details class="history measure" id="history" hidden><summary>Earlier versions</summary><ul></ul></details>
</main>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Still viewer">
  <div class="viewer-bar">
    <button class="icon-btn" id="v-close" type="button" aria-label="Close">@ICON_close@</button>
    <span class="title" id="v-title"></span>
    <button class="icon-btn" id="v-prev" type="button" aria-label="Previous still">@ICON_chevronLeft@</button>
    <button class="icon-btn" id="v-next" type="button" aria-label="Next still">@ICON_chevronRight@</button>
  </div>
  <div class="stage" id="stage"></div>
</div>

<script type="application/json" id="review-data">{"@DATA@":0}</script>
<script>
(() => {
  "use strict";
  const R = JSON.parse(document.getElementById("review-data").textContent);
  const ICON = { comment: `@ICON_pencilSimple@` };
  const $ = (s, el = document) => el.querySelector(s);
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "html") el.innerHTML = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return el;
  };
  const ic = (svg) => { const t = document.createElement("template"); t.innerHTML = svg.trim(); return t.content.firstElementChild; };
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  /* ---- Light and dark copies of one view (same change, same labels but theme) share a card and its
     number, in page order. Comments still name the still by its id. */
  const stills = [];
  const viewKey = (s) => [s.change.id, s.tags?.device, s.tags?.browser, s.tags?.mood, s.tags?.hue, s.tags?.state].join("|");
  const views = [];
  for (const c of R.changes) for (const s of c.stills) {
    s.change = c; stills.push(s);
    // Join the first view with the same labels that has no copy in this theme yet; two crops with the
    // same labels are two views.
    const key = viewKey(s);
    let view = views.find((v) => v.key === key && !v.some((o) => o.tags?.theme === s.tags?.theme));
    if (!view) { view = Object.assign([], { key }); views.push(view); }
    view.push(s); s.view = view; s.n = views.indexOf(view) + 1;
  }
  const byId = new Map(stills.map((s) => [s.id, s]));
  const tagLine = (s) => [s.tags?.device, s.tags?.browser, s.tags?.theme, s.tags?.mood, s.tags?.hue, s.tags?.state].filter(Boolean).join(" · ");
  const label = (s) => `${s.n} · ${tagLine(s)} · ${s.change.title}`.slice(0, 120);

  /* ---- Header */
  const when = new Date(R.updated);
  const whenText = Number.isNaN(when.getTime()) ? R.updated : when.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  $("#meta").textContent = [R.area, whenText, R.version > 1 ? `Version ${R.version}` : null].filter(Boolean).join(" · ");

  const checks = (R.check || []).map((c) => [c, byId.get(c.stills?.[0])]).filter(([, s]) => s);
  if (checks.length) $("#check-panel").append(...checks.map(([c, s]) =>
    h("li", {}, h("a", { href: `#${s.id.replace(/\./g, "-")}`, onclick: (e) => { e.preventDefault(); reveal(s); } }, c.text))));
  else $("#check-panel").remove();
  if (R.history?.length) {
    const d = $("#history"); d.hidden = false;
    $("ul", d).append(...R.history.map((v) => h("li", {}, h("strong", {}, `Version ${v.version}`), v.date ? ` (${v.date}): ` : ": ", v.summary)));
  }

  /* ---- Filters, built from the labels the stills carry. Only a label with two or more values gets one. */
  const FILTERS = ["theme", "device", "mood", "hue"];
  const picked = {};
  const filterRow = $("#filters");
  for (const key of FILTERS) {
    const values = [...new Set(stills.map((s) => s.tags?.[key]).filter(Boolean))].sort((a, b) => (key === "theme" ? (a === "Light" ? -1 : b === "Light" ? 1 : 0) : 0));
    if (values.length < 2) continue;
    // Theme has no "All": the card shows the copy for the picked theme, first the one the page is in.
    const first = key === "theme" ? (values.find((v) => v.toLowerCase() === (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) ?? values[0]) : "All";
    picked[key] = first;
    const group = h("div", { class: "filter", role: "group", "aria-label": key });
    for (const v of key === "theme" ? values : ["All", ...values]) group.append(h("button", { type: "button", "data-value": v, "aria-pressed": v === first ? "true" : "false", onclick: () => pick(key, v) }, v));
    filterRow.append(group);
  }
  if (!filterRow.children.length) filterRow.remove();
  function pick(key, v) {
    picked[key] = v;
    for (const b of filterRow.querySelectorAll(`[aria-label="${key}"] button`)) b.setAttribute("aria-pressed", b.dataset.value === v ? "true" : "false");
    applyFilters();
  }
  const matches = (s, k) => picked[k] === "All" || !s.tags?.[k] || s.tags[k] === picked[k];
  // A view with no copy in the picked theme still shows its first copy, so no view drops out.
  const visible = (s) => Object.keys(picked).every((k) => k === "theme" || matches(s, k)) &&
    (!picked.theme || matches(s, "theme") || (!s.view.some((o) => matches(o, "theme")) && s.view[0] === s));
  function applyFilters() {
    for (const s of stills) s.fig.hidden = !visible(s);
    for (const c of R.changes) c.section.hidden = c.stills.every((s) => s.fig.hidden);
    report();
  }

  /* ---- Changes and stills */
  const changesEl = $("#changes");
  for (const c of R.changes) {
    const grid = h("div", { class: "grid" });
    c.section = h("section", { class: "change", id: c.id, "aria-labelledby": `${c.id}-h` },
      h("div", { class: "change-head measure" }, h("h2", { id: `${c.id}-h` }, c.title), c.what ? h("p", {}, c.what) : null),
      grid);
    for (const s of c.stills) {
      const isVideo = /\.(mp4|webm)$/i.test(s.file);
      const media = isVideo
        ? h("video", { src: s.file, controls: true, muted: true, loop: true, playsinline: true, preload: "metadata", "aria-label": s.caption || label(s) })
        : h("img", { src: s.file, alt: s.caption || label(s), loading: "lazy", decoding: "async", width: s.width, height: s.height });
      media.dataset.still = s.id;
      if (!isVideo) media.addEventListener("load", report);
      const isNew = s.new_in === R.version;
      const tags = h("div", { class: "tags" },
        h("span", { class: "no" }, String(s.n)),
        h("span", { class: "tagline" }, tagLine(s)),
        isNew && R.version > 1 ? h("span", { class: "badge-label is-new" }, "Changed") : null,
        h("button", { class: "icon-btn comment-btn", type: "button", "data-comment": s.id, "aria-label": `Comment on ${s.n}`, onclick: () => commentOn(s) }, ic(ICON.comment)));
      // The picture opens the viewer; in comment mode the click goes to the composer first (capture below).
      s.mediaBox = h("div", { class: "media", role: "button", tabindex: "0", "aria-label": `Open ${s.n} full length`,
        onclick: (e) => { if (localPinMode !== s && e.target.tagName !== "VIDEO") openViewer(s); },
        onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openViewer(s); } } }, media);
      if (s.width && s.height) new ResizeObserver(() => s.mediaBox.classList.toggle("is-cut", s.mediaBox.scrollHeight > s.mediaBox.clientHeight + 1)).observe(s.mediaBox);
      s.media = media;
      s.notesEl = h("div", { class: "notes" });
      const wide = s.width > s.height || s.tags?.device === "Desktop";
      s.fig = h("figure", { class: `still${wide ? " is-wide" : ""}`, id: s.id.replace(/\./g, "-") },
        s.mediaBox, h("figcaption", {}, tags, s.caption ? h("p", { class: "cap" }, s.caption) : null), s.notesEl);
      grid.append(s.fig);
    }
    changesEl.append(c.section);
  }

  function reveal(s) {
    if (s.fig.hidden) for (const k of Object.keys(picked)) pick(k, k === "theme" ? s.tags?.theme ?? picked.theme : "All");
    const smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
    s.fig.scrollIntoView({ block: "center", behavior: smooth ? "smooth" : "auto" });
    s.fig.classList.add("is-flash"); setTimeout(() => s.fig.classList.remove("is-flash"), 1200);
    setTimeout(report, smooth ? 600 : 0);
  }

  /* ---- The viewer */
  const viewer = $("#viewer"), stage = $("#stage");
  let vs = null, vz = { k: 1, x: 0, y: 0, fit: 1 }, vEl = null;
  const order = () => stills.filter((s) => !s.fig.hidden);
  function openViewer(s) {
    vs = s; viewer.hidden = false; document.documentElement.style.overflow = "hidden";
    $("#v-title").textContent = `${s.n} · ${s.caption || tagLine(s)}`;
    stage.replaceChildren();
    vEl = s.media.cloneNode(true); vEl.removeAttribute("loading"); vEl.removeAttribute("width"); vEl.removeAttribute("height");
    vEl.dataset.still = s.id; stage.append(vEl);
    const el = vEl;
    const fit = () => {
      if (el !== vEl) return; // a later still replaced this one before it loaded
      const w = s.width || vEl.naturalWidth || vEl.videoWidth || 1, hh = s.height || vEl.naturalHeight || vEl.videoHeight || 1;
      vEl.style.width = `${w}px`; vEl.style.height = `${hh}px`;
      const r = stage.getBoundingClientRect();
      vz.fit = Math.min(r.width / w, r.height / hh, 1); // never past the picture's own pixels: crops blur
      vz.k = vz.fit; vz.x = (r.width - w * vz.k) / 2; vz.y = Math.max(0, (r.height - hh * vz.k) / 2); apply();
    };
    if (vEl.complete || vEl.tagName === "VIDEO") requestAnimationFrame(fit); else vEl.addEventListener("load", fit, { once: true });
    $("#v-close").focus();
  }
  function closeViewer() { const s = vs; viewer.hidden = true; vs = null; vEl = null; document.documentElement.style.overflow = ""; report(); s?.mediaBox.focus(); }
  function step(d) { const o = order(); const i = o.indexOf(vs); if (i < 0) return; openViewer(o[(i + d + o.length) % o.length]); }
  function apply() { if (vEl) vEl.style.transform = `translate(${vz.x}px, ${vz.y}px) scale(${vz.k})`; report(); }
  function zoomAt(cx, cy, k) {
    const r = stage.getBoundingClientRect(); const px = cx - r.left, py = cy - r.top;
    k = Math.min(Math.max(k, vz.fit * 0.5), vz.fit * 8);
    vz.x = px - ((px - vz.x) * k) / vz.k; vz.y = py - ((py - vz.y) * k) / vz.k; vz.k = k; apply();
  }
  $("#v-close").onclick = closeViewer; $("#v-prev").onclick = () => step(-1); $("#v-next").onclick = () => step(1);
  addEventListener("keydown", (e) => { if (viewer.hidden) return; if (e.key === "Escape") closeViewer(); if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1); });
  stage.addEventListener("wheel", (e) => { e.preventDefault(); zoomAt(e.clientX, e.clientY, vz.k * Math.exp(-e.deltaY * 0.002)); }, { passive: false });
  const pts = new Map(); let pinch = null, lastTap = 0, moved = false;
  stage.addEventListener("pointerdown", (e) => { if (commentMode) return; stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = false;
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: vz.k }; } });
  stage.addEventListener("pointermove", (e) => {
    const p = pts.get(e.pointerId); if (!p) return;
    if (pts.size === 2 && pinch) { pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); const [a, b] = [...pts.values()];
      zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, pinch.k * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d); moved = true; return; }
    vz.x += e.clientX - p.x; vz.y += e.clientY - p.y; if (Math.abs(e.clientX - p.x) + Math.abs(e.clientY - p.y) > 2) moved = true;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); apply();
  });
  const up = (e) => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
    if (e.type === "pointerup" && !moved && pts.size === 0) { const t = Date.now(); if (t - lastTap < 300) zoomAt(e.clientX, e.clientY, vz.k > vz.fit * 1.2 ? vz.fit : vz.fit * 2.5); lastTap = t; } };
  stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);

  /* ---- Comments.
     claude.ai comments first: a pin dropped on a still is a thread on this page, named by the still and
     its spot in percent ("queue-drag.phone-light@42.0,18.5"), so it stays on that spot at any size and
     in the viewer, and Send to Claude reaches the thread that owns the page. Where comments are off,
     the page keeps its own numbered notes and copies them as text. */
  let comments = null, ca = null, commentMode = false, threads = [];
  const ANCHOR = /^([a-z0-9][a-z0-9.-]*)(?:@(\d+(?:\.\d+)?),(\d+(?:\.\d+)?))?$/;
  const rectOf = (s) => {
    if (vs) return vs === s && vEl ? vEl.getBoundingClientRect() : null;
    if (s.fig.hidden) return null;
    return s.media.getBoundingClientRect();
  };
  function pointFor(anchor) {
    const m = ANCHOR.exec(anchor); if (!m) return null;
    const s = byId.get(m[1]); if (!s) return null;
    const r = rectOf(s); if (!r?.width) return null;
    const x = m[2] == null ? r.right - 20 : r.left + (r.width * +m[2]) / 100;
    const y = m[3] == null ? r.top + 20 : r.top + (r.height * +m[3]) / 100;
    if (!vs && y > s.mediaBox.getBoundingClientRect().bottom) return null; // on the faded-off part: shows in the viewer
    return { x: x + scrollX, y: y + scrollY };
  }
  let reportQueued = false;
  function report() {
    if (!ca || reportQueued) { renderLocalPins(); return; }
    reportQueued = true;
    requestAnimationFrame(() => { reportQueued = false; const map = {}; for (const t of threads) map[t.id] = pointFor(t.anchor); try { ca.placed(map); } catch {} });
    renderLocalPins();
  }
  addEventListener("resize", report);
  new ResizeObserver(report).observe(document.body);

  function hitStill(target) { const m = target.closest?.("[data-still]"); return m ? byId.get(m.dataset.still) : null; }
  function pct(el, e) { const r = el.getBoundingClientRect(); return [((e.clientX - r.left) / r.width) * 100, ((e.clientY - r.top) / r.height) * 100].map((v) => Math.min(100, Math.max(0, v)).toFixed(1)); }

  async function commentOn(s) {
    if (ca) {
      const r = rectOf(s); if (!r) return;
      try { await ca.compose(s.id, { x: r.right - 20 + scrollX, y: r.top + 20 + scrollY }, { label: label(s), detail: s.caption || undefined }); } catch (e) { console.warn("compose", e?.code); }
      return;
    }
    if (comments) { try { await comments.openComposer({ element: s.media }); } catch (e) { console.warn("openComposer", e?.code); } return; }
    localPinMode = s; s.mediaBox.style.cursor = "crosshair";
    s.notesEl.prepend(h("p", { class: "meta", "data-hint": "" }, "Tap the spot."));
  }

  document.addEventListener("click", async (e) => {
    if (!ca || !commentMode) return;
    const s = hitStill(e.target);
    e.preventDefault(); e.stopPropagation();
    try {
      if (s) { const [x, y] = pct(e.target.closest("[data-still]"), e); await ca.compose(`${s.id}@${x},${y}`, { x: e.pageX, y: e.pageY }, { label: `${label(s)} · at ${x}%, ${y}%`, detail: s.caption || undefined }); }
      else { const el = e.target.closest("h1,h2,li,p,figure,section") || e.target; const [a, at] = ca.domAnchor(el, e); await ca.compose(a, at); }
    } catch (err) { console.warn("compose", err?.code); }
  }, true);

  (async () => {
    try { comments = await window.claude?.use?.("comments"); } catch { comments = null; }
    if (comments) {
      try {
        ca = await comments.customAnchors({
          mode(on) { commentMode = on; document.documentElement.toggleAttribute("data-comment-mode", on); if (!on) threads = []; report(); },
          threads(list) { threads = list; report(); },
          reveal(id) { const t = threads.find((x) => x.id === id); const m = t && ANCHOR.exec(t.anchor); const s = m && byId.get(m[1]); if (s) { if (vs && vs !== s) closeViewer(); if (!vs) reveal(s); } else report(); },
          composing() {},
        });
        report();
      } catch (e) { ca = null; }
    } else {
      setupLocalNotes();
    }
  })();

  /* ---- Page notes (only when claude.ai comments are off) */
  const NOTES_KEY = `review-notes:${R.pr}:v${R.version}`;
  let notes = [], localPinMode = null;
  function setupLocalNotes() {
    notes = store.get(NOTES_KEY, []);
    const copy = $("#notes-copy");
    copy.onclick = async () => {
      const text = notesText();
      try { await navigator.clipboard.writeText(text); copy.textContent = "Copied"; setTimeout(() => (copy.textContent = "Copy notes"), 1500); }
      catch { const ta = h("textarea", { style: "position:fixed;inset:auto 0 0;height:40vh;z-index:30" }); ta.value = text; document.body.append(ta); ta.select(); ta.addEventListener("blur", () => ta.remove()); }
    };
    for (const s of stills) s.mediaBox.addEventListener("click", (e) => {
      if (localPinMode !== s || e.target.closest("button")) return;
      const [x, y] = pct(s.media, e);
      notes.push({ still: s.id, x: +x, y: +y, text: "" }); localPinMode = null; s.mediaBox.style.cursor = "";
      s.notesEl.querySelector("[data-hint]")?.remove(); save(); renderNotes(); [...s.notesEl.querySelectorAll(".note textarea")].at(-1)?.focus();
    });
    renderNotes();
  }
  function save() { store.set(NOTES_KEY, notes); }
  function renderNotes() {
    $("#notes-copy").hidden = !notes.some((n) => n.text.trim());
    for (const s of stills) {
      for (const n of s.notesEl.querySelectorAll(".note")) n.remove();
      notes.forEach((n, i) => {
        if (n.still !== s.id) return;
        const ta = h("textarea", { "aria-label": `Note ${i + 1}`, maxlength: "2000" }); ta.value = n.text;
        ta.addEventListener("input", () => { n.text = ta.value; save(); $("#notes-copy").hidden = !notes.some((x) => x.text.trim()); });
        s.notesEl.append(h("div", { class: "note" }, h("span", { class: "pin" }, String(i + 1)), ta,
          h("button", { class: "icon-btn", type: "button", "aria-label": `Remove note ${i + 1}`, html: `@ICON_close@`, onclick: () => { notes.splice(i, 1); save(); renderNotes(); } })));
      });
    }
    renderLocalPins();
  }
  function renderLocalPins() {
    for (const p of document.querySelectorAll(".media > .pin")) p.remove();
    notes.forEach((n, i) => { const s = byId.get(n.still); if (!s) return; s.mediaBox.append(h("span", { class: "pin", style: `left:${n.x}%;top:${n.y}%` }, String(i + 1))); });
  }
  function notesText() {
    const lines = [`Review notes: PR #${R.pr}, version ${R.version}`];
    notes.forEach((n, i) => { const s = byId.get(n.still); if (s && n.text.trim()) lines.push(`${i + 1}. Still ${s.n} (${tagLine(s)}, ${s.change.title}) at ${n.x}%, ${n.y}%: ${n.text.trim()}`); });
    return lines.join("\n");
  }

  applyFilters();
})();
</script>
